<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
<h1>Dashboard</h1>
<p>Bienvenido, <strong th:text="${usuario.nombre}"></strong></p>
<p>Correo: <span th:text="${usuario.email}"></span></p>
<p>Rol: <span th:text="${usuario.rol}"></span></p>

<nav>
    <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">Administrar usuarios</a>
    <a th:href="@{/logout}" onclick="event.preventDefault(); this.closest('body').querySelector('form').submit();">Cerrar sesión</a>
</nav>

<form th:action="@{/logout}" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
</form>
</body>
</html>
