<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
<h1>Registro de usuario</h1>
<form th:action="@{/register}" th:object="${registroForm}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div>
        <label>Nombre</label>
        <input type="text" th:field="*{nombre}" />
        <small th:errors="*{nombre}"></small>
    </div>
    <div>
        <label>Correo</label>
        <input type="email" th:field="*{email}" />
        <small th:errors="*{email}"></small>
    </div>
    <div>
        <label>Contraseña</label>
        <input type="password" th:field="*{contrasenia}" />
        <small th:errors="*{contrasenia}"></small>
    </div>
    <button type="submit">Crear cuenta</button>
</form>
<a th:href="@{/login}">Volver al login</a>
</body>
</html>
